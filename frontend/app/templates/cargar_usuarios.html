<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cargar Usuarios</title>
</head>
<body>
    <h1>Cargar Usuarios</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="archivo">Archivo XML:</label>
        <input type="file" name="archivo" id="archivo" accept=".xml" required>
        <br>
        <button type="submit">Cargar</button>
    </form>
</body>
</html>
