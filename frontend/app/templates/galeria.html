<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>IPCArt-Studio</h2>
            <nav>
                <ul>
                    <li><a href="{% url 'usuario_dashboard' %}">Inicio</a></li>
                    <li><a href="{% url 'galeria' %}">Galería</a></li>
                    <li><a href="{% url 'subir_imagen' %}">Subir Imagen</a></li>
                    <li><a href="{% url 'logout' %}">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>
        <main class="content">
            <h1>Galería de Imágenes</h1>
            {% if imagenes %}
            <div class="galeria">
                {% for imagen in imagenes %}
                    <div class="imagen-container">
                        <img src="{{ imagen }}" alt="Imagen">
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p>No hay imágenes disponibles para mostrar.</p>
        {% endif %}        
        </main>
    </div>
</body>
</html>
