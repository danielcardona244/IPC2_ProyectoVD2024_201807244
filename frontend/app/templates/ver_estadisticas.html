<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>IPCArt-Studio</h2>
            <nav>
                <ul>
                    <li><a href="{% url 'admin_dashboard' %}">Inicio</a></li>
                    <li><a href="{% url 'ver_usuarios' %}">Usuarios</a></li>
                    <li><a href="{% url 'ver_xml' %}">Ver XML</a></li>
                    <li><a href="{% url 'ver_estadisticas' %}">Estadísticas</a></li>
                    <li><a href="{% url 'logout' %}">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>
        <main class="content">
            <h1>Estadísticas</h1>
            {% if error %}
                <div class="error">
                    <p>{{ error }}</p>
                </div>
            {% else %}
                <h2>Top 3 de usuarios con más imágenes cargadas</h2>
                <img src="{{ top3_chart_url }}" alt="Top 3 de usuarios">
                <h2>Imágenes procesadas por usuario</h2>
                <img src="{{ images_per_user_chart_url }}" alt="Imágenes procesadas">
            {% endif %}
        </main>
    </div>
</body>
</html>
